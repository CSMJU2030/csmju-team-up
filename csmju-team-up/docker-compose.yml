name: csmju-team-up

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: teamup
      POSTGRES_DB: csmju_team_up_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - teamup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamup -d csmju_team_up_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql://teamup:teamup@db:5432/csmju_team_up_db
      DIRECT_URL: postgresql://teamup:teamup@db:5432/csmju_team_up_db
      DATABASE_POOL_MAX: "5"
      CORS_ORIGIN: http://localhost:3220
      APP_BASE_URL: http://localhost:3220
      CORE_HUB_URL: https://csmju2030.jowave.com
      CORE_HUB_JWKS_URL: https://csmju2030.jowave.com/api/v1/.well-known/jwks.json
      CORE_HUB_WEB_URL: https://csmju2030.jowave.com
      CORE_HUB_ISSUER: core-hub
      CORE_HUB_AUDIENCE: csmju2030
      SUBSYSTEM_ID: csmju-team-up
      JWKS_CACHE_TTL_MS: "600000"
      JWKS_MIN_REFRESH_INTERVAL_MS: "30000"
      JWKS_REQUEST_TIMEOUT_MS: "5000"
      JWT_CLOCK_TOLERANCE_SEC: "5"
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    ports:
      - "127.0.0.1:4220:4000"

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://api:4000
    environment:
      NODE_ENV: production
      CORE_HUB_WEB_URL: https://csmju2030.jowave.com
      SUBSYSTEM_ID: csmju-team-up
      TZ: Asia/Bangkok
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m
      - /app/frontend/.next/cache:size=64m
    mem_limit: 384m
    ports:
      - "127.0.0.1:3220:3000"

volumes:
  teamup-postgres:
