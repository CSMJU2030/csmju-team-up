<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CS TeamUp — Project Collaborator Finder</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pc:#2154d9;--op:#fff;--fc:#3B80F2;--bg:#f6f7fb;--cd:#fff;--tx:#1a1c23;--mu:#6b7280;--bd:#e5e7eb;--gr:#1a9a5b;--rd:#d0433f;--am:#c17d11}
/* Dark mode intentionally not auto-applied — other CSMJU2030 subsystems (Interactive Map, SkillForge) stay light regardless of system theme, so CS TeamUp matches that and stays light too */
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx)}
.shell{display:flex;min-height:100%}
.sidebar{width:232px;flex-shrink:0;background:var(--cd);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:18px 14px;gap:4px;position:sticky;top:0;align-self:flex-start;height:100vh;z-index:20}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.sb-logo .mark{width:34px;height:34px;border-radius:10px;background:var(--pc);color:var(--op);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}
.sb-logo b{display:block;font-size:.95rem;line-height:1.2}
.sb-logo span{display:block;font-size:.68rem;color:var(--mu)}
.sb-label{font-size:.68rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding:10px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--tx);opacity:.8;font-size:.86rem;font-weight:600;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
.nv svg{flex-shrink:0;opacity:.8}
.nv.on{opacity:1;background:rgba(33,84,217,.1);color:var(--pc)}.nv.on svg{opacity:1}
.sb-foot{margin-top:auto;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:.72rem;color:var(--mu);line-height:1.5}
.mainarea{flex:1;min-width:0}
.topbar{position:sticky;top:0;background:var(--cd);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;z-index:10}
.topbar .crumb{font-size:.72rem;color:var(--mu);margin:0 0 2px}
.topbar h2{font-size:1.15rem;margin:0}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bell{position:relative;background:transparent;border:0;color:var(--mu);cursor:pointer;padding:6px 8px;display:flex;align-items:center;border-radius:8px}
.bell:hover{color:var(--pc);background:rgba(33,84,217,.08)}
#bc{position:absolute;top:0;right:2px;background:var(--rd);color:#fff;font-size:.62rem;border-radius:999px;padding:1px 5px;display:none;border:1.5px solid var(--cd)}
main{max-width:960px;margin:0 auto;padding:16px 20px 60px}
@media(max-width:760px){
.shell{flex-direction:column}
.sidebar{width:100%;height:auto;position:sticky;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;gap:2px}
.sb-logo{padding:0 10px 0 0;border-right:1px solid var(--bd);margin-right:4px}
.sb-logo span,.sb-label,.sb-foot{display:none}
.nv{width:auto;white-space:nowrap}
}
.btn{border:0;border-radius:10px;padding:9px 15px;font-size:.86rem;font-weight:600;cursor:pointer}.btn:hover{opacity:.9}
.sol{background:var(--pc);color:var(--op)}.gh{background:transparent;color:var(--mu)}.wh{background:var(--op);color:var(--pc)}
.ib{border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:8px;padding:5px 10px;font-size:.76rem;cursor:pointer}.ib:hover{border-color:var(--fc);color:var(--fc)}.ib.rd{color:var(--rd)}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:4px;width:fit-content;max-width:100%;overflow-x:auto}
.tb{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-size:.82rem;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}.tb.on{background:var(--pc);color:var(--op)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input:not([type=checkbox]):not([type=file]),select,textarea{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:9px 11px;font-size:.88rem;outline:0;font-family:inherit;max-width:100%}
input:not([type=checkbox]):not([type=file]){flex:1 1 180px}textarea{width:100%;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--fc);box-shadow:0 0 0 3px rgba(59,128,242,.18)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:7px;cursor:pointer}.card:hover{border-color:var(--fc)}
.card h3{margin:0;font-size:1rem}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row2>*{flex:1 1 120px}.row2>button{flex:0 0 auto}
.tag{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(33,84,217,.12);color:var(--pc)}.tag.g{background:rgba(26,154,91,.14);color:var(--gr)}
.chip{font-size:.72rem;background:var(--bg);border:1px solid var(--bd);padding:3px 8px;border-radius:8px}
.bdg{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:rgba(193,125,17,.15);color:var(--am)}
.s-Recruiting,.b-accepted{background:rgba(26,154,91,.15);color:var(--gr)}.s-InProgress{background:rgba(33,84,217,.14);color:var(--pc)}.s-Completed{background:rgba(107,114,128,.18);color:var(--mu)}.b-declined,.b-rejected{background:rgba(208,67,63,.13);color:var(--rd)}
.mu{font-size:.78rem;color:var(--mu)}.ds{font-size:.85rem;line-height:1.45;opacity:.92}.empty{text-align:center;color:var(--mu);padding:40px 10px}
.sec{font-size:.86rem;font-weight:700;margin:18px 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{display:block;font-size:1.5rem;color:var(--pc)}.stat span{font-size:.76rem;color:var(--mu)}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--bd);background:var(--cd);border-radius:10px;margin-bottom:6px;font-size:.85rem}.lr[data-a]{cursor:pointer}.lr.un{border-left:3px solid var(--pc)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:flex-start;padding:20px 12px;overflow-y:auto;z-index:50}.ov.open{display:flex}
.md{background:var(--cd);border-radius:16px;padding:18px;width:100%;max-width:560px;margin-top:14px}.md h2{margin:8px 0 4px;font-size:1.08rem}
label{display:block;font-size:.78rem;font-weight:600;margin:11px 0 5px}label.ck{display:flex;gap:8px;align-items:center}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.qa{padding:8px 0;border-bottom:1px solid var(--bd);font-size:.84rem;line-height:1.5}
.mb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mb button{border:0;background:transparent;font-size:.72rem;font-weight:700;cursor:pointer;padding:3px 5px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.84rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}.toast.show{opacity:1}
.avatar{border-radius:50%;background:var(--pc);color:var(--op);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.av-row{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.hidefile{display:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.gitem{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bd);aspect-ratio:1}
.gitem img{width:100%;height:100%;object-fit:cover;display:block}
.gitem .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;padding:3px 5px}
.gitem .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:6px;font-size:.62rem;padding:2px 6px;cursor:pointer}
.banner{background:rgba(33,84,217,.08);border:1px solid rgba(33,84,217,.3);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.84rem}
.thread{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;padding:4px 2px;margin-bottom:8px}
.bubble{max-width:78%;padding:8px 11px;border-radius:12px;font-size:.85rem;margin-bottom:6px;line-height:1.4}
.b-me{background:var(--pc);color:var(--op);margin-left:auto;border-bottom-right-radius:3px}
.b-oth{background:var(--bg);border:1px solid var(--bd);margin-right:auto;border-bottom-left-radius:3px}
.sharebox{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:.82rem;line-height:1.6;white-space:pre-wrap;margin:10px 0}
</style></head><body>
<div class="shell">
<aside class="sidebar">
<div class="sb-logo"><div class="mark">CT</div><div><b>CS TeamUp</b><span>CSMJU2030</span></div></div>
<div class="sb-label">เมนู</div>
<button class="nv" data-a="nav" data-v="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>ค้นหาโปรเจกต์</button>

<button class="nv" data-a="nav" data-v="msg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.8 8.38 8.5 8.5 0 0 1-3.2-.62L3 20l1.3-3.9a8.38 8.38 0 0 1-.6-3.1A8.38 8.38 0 0 1 12.2 4a8.5 8.5 0 0 1 8.8 7.5Z"/></svg>ข้อความ</button>
<button class="nv" data-a="nav" data-v="prof"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>โปรไฟล์</button>

<div class="mainarea">

<div><p class="crumb">CSMJU2030 · CS TeamUp</p><h2 id="pageTitle">ค้นหาโปรเจกต์</h2></div>
<div class="hr">
<button class="btn sol" data-a="newp">+ โพสต์</button>
<button class="bell" data-a="bell" aria-label="การแจ้งเตือน"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bc"></span></button>

</div></div>
<main><div class="tabs" id="tabs"></div>
<div class="bar" id="bar"><input id="q" placeholder="ค้นหาชื่อ ทักษะ ตำแหน่ง..."><select id="fkind"><option value="">ทุกประเภท</option></select><select id="ffmt"><option value="">ทุกรูปแบบ</option></select><select id="ffsk"><option value="">ทุกทักษะ</option></select><select id="fstat"><option value="">ทุกสถานะ</option></select></div>
<div id="view"></div></main>
</div></div>

<script>
(function(){
const K='csteamup_v4',$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sp=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const ST=['Recruiting','In Progress','Completed'],STT={'Recruiting':'กำลังหาคน','In Progress':'กำลังพัฒนา','Completed':'เสร็จสมบูรณ์'};
const KINDS=['งานรายวิชา','โปรเจกต์จบ (Senior Project)','ส่วนตัว/แข่งขัน (Hackathon)'];
const FORMATS=['ออนไลน์','ออนไซต์','ผสม (Hybrid)'];
const MB={pending:'รอตอบรับ',accepted:'เข้าร่วมแล้ว',rejected:'ปฏิเสธแล้ว'};
const IB={pending:'รอตอบรับ',accepted:'ตอบรับแล้ว',declined:'ปฏิเสธแล้ว'};
function svgPlaceholder(label,hex){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="'+hex+'"/><text x="50%" y="50%" fill="white" font-size="26" font-family="sans-serif" text-anchor="middle" dy=".3em">'+label+'</text></svg>')}
function seed(){return{simN:0,follows:['p1'],reviews:[{project:'p4',to:'สมชาย ใจดี',from:'ก้อง',stars:5,comment:'ทำงานดีมาก ส่งตรงเวลา',ts:Date.now()-86400000*3}],
me:{name:'สมชาย ใจดี',email:'student@core.local',role:'student',avatar:'',skills:['React','Python'],github:'',linkedin:'',contact:'',available:true,
history:[{t:'ระบบยืม-คืนหนังสือ',y:'2568'}],portfolio:[{id:'g1',img:svgPlaceholder('UI Design','2154d9'),caption:'ตัวอย่างผลงานออกแบบ UI'}]},
users:[{name:'พลอย',skills:['UI/UX','Figma'],available:true},{name:'เจมส์',skills:['Flutter','Python'],available:true},{name:'ต้น',skills:['Node.js','MongoDB','React'],available:true},{name:'มด',skills:['React','Next.js'],available:false}],
notifs:[{to:'me',text:'ยินดีต้อนรับสู่ CS TeamUp',ts:Date.now(),read:false}],
messages:{'ก้อง':[{from:'them',text:'สนใจร่วมทีม CS TeamUp ไหมครับ',ts:Date.now()-3600000}]},
projects:[
{id:'p1',title:'CS TeamUp — Project Collaborator Finder',kind:KINDS[0],course:'CS 401',size:4,duration:'1 เทอม',format:FORMATS[2],desc:'ระบบหาเพื่อนร่วมทีมทำโปรเจกต์ ทั้งส่วนตัวและของมหาลัย เพื่อสะสมผลงาน',roles:['Frontend','Backend'],skills:['React','Node.js'],contact:'line: csteamup',owner:'ก้อง',status:'Recruiting',members:[{id:'m1',name:'พลอย',role:'UI',msg:'',status:'accepted'}],qa:[{q:'ต้องมีประสบการณ์ไหม?',a:'ไม่จำเป็น ขอแค่ตั้งใจ'}],invites:[{id:'inv2',name:'ต้น',role:'Backend',status:'pending'}]},
{id:'p2',title:'ระบบครุภัณฑ์ (equipment)',kind:KINDS[0],course:'CS 305',size:3,duration:'2 เดือน',format:FORMATS[1],desc:'ระบบยืม-คืนครุภัณฑ์ของสาขา ต้องการคนช่วย backend และ conformance test',roles:['Backend','QA'],skills:['Python','Node.js'],contact:'equipment@cmju.ac.th',owner:'นุ่น',status:'Recruiting',members:[],qa:[],invites:[{id:'inv1',role:'QA',status:'pending',me:true}]},
{id:'p3',title:'แอปติดตามงบส่วนตัว',kind:KINDS[2],course:'',size:2,duration:'ไม่กำหนด',format:FORMATS[0],desc:'โปรเจกต์ portfolio อยากได้เพื่อนช่วย UI/UX และ mobile',roles:['UI Designer','Mobile Dev'],skills:['UI/UX','Flutter'],contact:'line: budget',owner:'me',status:'Recruiting',members:[{id:'m2',name:'เจมส์',role:'Mobile Dev',msg:'เคยทำ Flutter',status:'pending'}],qa:[{q:'ทำงานออนไลน์ได้ไหม?',a:''}],invites:[]},
{id:'p4',title:'Senior Project: ระบบแนะนำงานฝึกสหกิจ',kind:KINDS[1],course:'',size:3,duration:'2 เทอม',format:FORMATS[2],desc:'ระบบแนะนำสถานประกอบการสหกิจตามทักษะนักศึกษา',roles:['Data','Frontend'],skills:['Python','React'],contact:'kong@cmju.ac.th',owner:'ก้อง',status:'Completed',members:[{id:'m4',name:'สมชาย ใจดี',role:'Frontend',msg:'',status:'accepted',me:true}],qa:[],invites:[]},
{id:'p5',title:'เว็บไซต์จองห้องประชุมสาขา',kind:KINDS[0],course:'CS 210',size:2,duration:'1 เทอม',format:FORMATS[1],desc:'โปรเจกต์ทำเสร็จแล้ว ใช้ทดสอบระบบให้คะแนนความน่าเชื่อถือหลังจบงาน',roles:['Backend'],skills:['Node.js'],contact:'-',owner:'me',status:'Completed',members:[{id:'m5',name:'มด',role:'Backend',msg:'',status:'accepted'}],qa:[],invites:[]}]}}
let S;try{const r=localStorage.getItem(K);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
S.projects.forEach(p=>{p.invites=p.invites||[];p.qa=p.qa||[];p.duration=p.duration||'-';p.format=p.format||FORMATS[0]});
S.messages=S.messages||{};S.me.avatar=S.me.avatar||'';S.me.portfolio=S.me.portfolio||[];S.reviews=S.reviews||[];
const V={view:'home',tab:'all',open:null,m:null,edit:null,msgWith:null,starTmp:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){console.warn('storage full',e)}};
const mine=p=>p.owner==='me',acc=p=>p.members.filter(m=>m.status==='accepted').length,pend=p=>p.members.filter(m=>m.status==='pending').length;
const cur=()=>S.projects.find(x=>x.id===V.open);
const mName=m=>m.me?S.me.name:m.name;
const ivName=iv=>iv.me?S.me.name:iv.name;
const norm=a=>(a||[]).map(x=>x.toLowerCase());
const score=(p,sk)=>{const r=norm(p.skills),s=norm(sk);return r.length?Math.round(r.filter(x=>s.includes(x)).length/r.length*100):0};
const notify=(to,text)=>S.notifs.unshift({to,text,ts:Date.now(),read:false});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
const chips=a=>(a||[]).map(r=>`<span class="chip">${esc(r)}</span>`).join('');
const sb=s=>`<span class="bdg s-${s.replace(' ','')}">${STT[s]}</span>`;
const mbd=m=>`<span class="bdg ${m.status!=='pending'?'b-'+m.status:''}">${MB[m.status]}</span>`;
const ivbd=iv=>`<span class="bdg ${iv.status!=='pending'?'b-'+iv.status:''}">${IB[iv.status]}</span>`;
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function starSVG(filled){return `<svg width="15" height="15" viewBox="0 0 24 24" fill="${filled?'var(--am)':'none'}" stroke="${filled?'var(--am)':'var(--mu)'}" stroke-width="1.5" style="vertical-align:-2px"><path d="M12 2.5l2.9 6 6.6.7-4.9 4.5 1.3 6.5L12 16.8l-5.9 3.4 1.3-6.5-4.9-4.5 6.6-.7z"/></svg>`}
function starsPicker(name){const cur=V.starTmp[name]||0;return Array.from({length:5},(_,i)=>i+1).map(n=>`<button data-a="setstar" data-name="${esc(name)}" data-n="${n}" style="background:transparent;border:0;cursor:pointer;padding:1px">${starSVG(n<=cur)}</button>`).join('')}
function ratingBadge(name){const rs=S.reviews.filter(r=>r.to===name);if(!rs.length)return '<span class="mu" style="font-size:.72rem">ยังไม่มีรีวิว</span>';
const avg=(rs.reduce((a,r)=>a+r.stars,0)/rs.length).toFixed(1);

function readResized(file,maxDim,cb){

function form(p){V.m='form';V.edit=p?p.id:null;const v=p||{title:'',kind:KINDS[0],course:'',size:'',duration:'',format:FORMATS[0],desc:'',roles:[],skills:[],contact:''};
M(`<h2>${p?'แก้ไข':'โพสต์'}โปรเจกต์</h2><label>ชื่อโปรเจกต์</label><input id="ft" value="${esc(v.title)}" style="width:100%">
<div class="row2"><div><label>ประเภท</label><select id="fkd" style="width:100%">${KINDS.map(k=>`<option ${k===v.kind?'selected':''}>${k}</option>`).join('')}</select></div><div><label>รหัสวิชา (ถ้ามี)</label><input id="fc" value="${esc(v.course)}" style="width:100%"></div><div><label>จำนวนคน</label><input id="fz" value="${esc(v.size)}" style="width:100%"></div></div>
<div class="row2"><div><label>รูปแบบงาน</label><select id="ffm" style="width:100%">${FORMATS.map(f=>`<option ${f===v.format?'selected':''}>${f}</option>`).join('')}</select></div><div><label>ระยะเวลา</label><input id="fdur" value="${esc(v.duration==='-'?'':v.duration)}" placeholder="เช่น 1 เทอม" style="width:100%"></div></div>
<label>รายละเอียด</label><textarea id="fd">${esc(v.desc)}</textarea><label>ตำแหน่งที่ต้องการ (คั่นด้วย ,)</label><input id="fr" value="${esc(v.roles.join(', '))}" style="width:100%"><label>Skill ที่ต้องการ (คั่นด้วย ,)</label><input id="fsk" value="${esc(v.skills.join(', '))}" style="width:100%"><label>ช่องทางติดต่อ</label><input id="fx" value="${esc(v.contact)}" style="width:100%">
<div class="acts"><button class="btn gh" data-a="close">ยกเลิก</button><button class="btn sol" data-a="savef">บันทึก</button></div>`)}
function notifM(){V.m='notif';const l=S.notifs.filter(n=>n.to==='me');
M(`<h2>การแจ้งเตือน</h2><div class="row" style="margin:6px 0 10px"><button class="ib" data-a="readall">อ่านทั้งหมด</button><button class="ib" data-a="sim">จำลองเหตุการณ์ (เดโม)</button></div>${l.map(n=>`<div class="lr ${n.read?'':'un'}"><div>${esc(n.text)}<div class="mu">${new Date(n.ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="mu">ไม่มีการแจ้งเตือน</div>'}<div class="acts"><button class="btn gh" data-a="close">ปิด</button></div>`)}
function sim(){const n=S.simN++%5;
if(n===0){const p=S.projects.find(mine);if(p){p.members.push({id:'m'+Date.now(),name:'ต้น',role:'Backend',msg:'สนใจครับ',status:'pending'});notify('me',`ต้น สมัครเข้าร่วม "${p.title}"`)}}
else if(n===1){const p=S.projects.find(p=>p.members.some(m=>m.me&&m.status==='pending'));if(p){p.members.find(m=>m.me).status='accepted';notify('me',`คุณได้รับการยอมรับเข้าโปรเจกต์ "${p.title}"`)}else toast('ไม่มีคำขอที่รอตอบรับ')}
else if(n===2){const p=S.projects.find(p=>!mine(p)&&S.follows.includes(p.id)&&p.status!=='Completed');if(p){p.status=ST[ST.indexOf(p.status)+1];notify('me',`โปรเจกต์ที่ติดตาม "${p.title}" เปลี่ยนเป็น ${STT[p.status]}`)}else toast('ไม่มีโปรเจกต์ที่ติดตามและยังไม่เสร็จ')}
else if(n===3){const p=S.projects.find(pp=>mine(pp)&&pp.invites.some(iv=>iv.status==='pending'&&!iv.me));
  if(p){const iv=p.invites.find(iv=>iv.status==='pending'&&!iv.me);iv.status='accepted';p.members.push({id:'m'+Date.now(),name:iv.name,role:iv.role,msg:'',status:'accepted'});notify('me',`${iv.name} ตอบรับคำเชิญเข้าร่วม "${p.title}"`)}else toast('ไม่มีคำเชิญที่รอตอบรับ')}
else{const names=Object.keys(S.messages);if(names.length){const nm=names[Math.floor(Math.random()*names.length)];S.messages[nm].push({from:'them',text:'อัปเดตความคืบหน้าให้แล้วนะครับ',ts:Date.now()});notify('me',`ข้อความใหม่จาก ${nm}`)}else toast('ยังไม่มีบทสนทนา')}
refresh()}
document.addEventListener('click',e=>{if(e.target.id==='ov'){closeM();render();return}
const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,i=+t.dataset.i,p=cur(),v=x=>$('#'+x).value.trim();
const mem=()=>p.members.find(m=>m.id===id);
switch(a){
case'nav':V.view=t.dataset.v;render();break;
case'tab':V.tab=t.dataset.v;render();break;
case'open':V.open=id;det();break;
case'close':closeM();render();break;
case'bell':notifM();break;
case'readall':S.notifs.forEach(n=>n.read=true);refresh();break;
case'sim':sim();break;
case'newp':form(null);break;
case'editp':form(p);break;
case'savef':{if(!v('ft')||!v('fd')){toast('กรุณากรอกชื่อและรายละเอียด');break}
const d={title:v('ft'),kind:$('#fkd').value,course:v('fc'),size:v('fz')||'-',format:$('#ffm').value,duration:v('fdur')||'-',desc:v('fd'),roles:sp(v('fr')),skills:sp(v('fsk')),contact:v('fx')||'-'};
if(V.edit)Object.assign(S.projects.find(x=>x.id===V.edit),d);else S.projects.unshift(Object.assign({id:'p'+Date.now(),owner:'me',status:'Recruiting',members:[],qa:[],invites:[]},d));
toast(V.edit?'บันทึกแล้ว':'โพสต์แล้ว');save();closeM();render();break}
case'delp':if(confirm('ลบโปรเจกต์นี้?')){S.projects=S.projects.filter(x=>x.id!==p.id);S.follows=S.follows.filter(x=>x!==p.id);save();closeM();render();toast('ลบแล้ว')}break;
case'acc':case'rej':case'rem':{const m=mem();if(!m)break;
if(a==='rem')p.members=p.members.filter(x=>x.id!==id);else m.status=a==='acc'?'accepted':'rejected';
notify(mName(m),`${a==='acc'?'คุณได้รับการยอมรับเข้า':a==='rej'?'คำขอถูกปฏิเสธจาก':'คุณถูกลบออกจาก'} "${p.title}"`);toast('ส่งแจ้งเตือนถึง '+mName(m)+' แล้ว');refresh();break}
case'apply':p.members.push({id:'m'+Date.now(),name:S.me.name,role:v('ar'),msg:v('am'),status:'pending',me:true});notify(p.owner,`${S.me.name} สมัครเข้าร่วม "${p.title}"`);toast('ส่งคำขอแล้ว (แจ้งเตือนเจ้าของโปรเจกต์)');refresh();break;
case'fol':S.follows=S.follows.includes(p.id)?S.follows.filter(x=>x!==p.id):S.follows.concat(p.id);refresh();break;
case'ask':if(!v('qi'))break;p.qa.push({q:v('qi'),a:''});notify(p.owner,`มีคำถามใหม่ใน "${p.title}"`);refresh();break;
case'ans':if(!v('an'+i))break;p.qa[i].a=v('an'+i);refresh();break;
case'invite':{const name=t.dataset.name;p.invites.push({id:'inv'+Date.now(),name,role:(p.roles[0]||''),status:'pending'});notify(name,`คุณได้รับเชิญเข้าร่วม "${p.title}"`);toast('ส่งคำเชิญถึง '+name+' แล้ว');refresh();break}
case'invacc':case'invdec':{const pid=t.dataset.pid||V.open,pr=S.projects.find(x=>x.id===pid),iv=pr.invites.find(x=>x.id===id);if(!iv)break;
if(a==='invacc'){iv.status='accepted';pr.members.push({id:'m'+Date.now(),name:S.me.name,role:iv.role||'',msg:'',status:'accepted',me:true});notify(pr.owner,`${S.me.name} ตอบรับคำเชิญเข้าร่วม "${pr.title}"`);toast('เข้าร่วมโปรเจกต์แล้ว')}
else{iv.status='declined';notify(pr.owner,`${S.me.name} ปฏิเสธคำเชิญเข้าร่วม "${pr.title}"`);toast('ปฏิเสธคำเชิญแล้ว')}refresh();break}
case'msgto':threadM(t.dataset.name);break;
case'sendmsg':{const name=t.dataset.name,txt=v('mtext');if(!txt)break;
S.messages[name]=S.messages[name]||[];S.messages[name].push({from:'me',text:txt,ts:Date.now()});save();threadM(name);
setTimeout(()=>{const rp=['ได้เลยครับ เดี๋ยวตอบรายละเอียดให้','ขอบคุณที่ทักมานะครับ','โอเคครับ ไว้คุยกันต่อ','รับทราบครับ'];
S.messages[name].push({from:'them',text:rp[Math.floor(Math.random()*rp.length)],ts:Date.now()});save();
if(V.m==='thread'&&V.msgWith===name)threadM(name);else render()},1000);break}
case'pickav':$('#avfile').click();break;
case'pickgal':$('#galfile').click();break;
case'delg':S.me.portfolio=S.me.portfolio.filter(x=>x.id!==id);save();render();break;
case'savepf':Object.assign(S.me,{name:v('pn'),skills:sp(v('pk')),github:v('pg'),linkedin:v('pl'),contact:v('pc'),available:$('#pa').checked});save();render();toast('บันทึกโปรไฟล์แล้ว');break;
case'addh':if(!v('ht'))break;S.me.history.push({t:v('ht'),y:v('hy')||'-'});save();render();break;
case'delh':S.me.history.splice(i,1);save();render();break;
case'share':shareM(p.id);break;
case'copyshare':{const txt=t.dataset.text;
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกแล้ว')).catch(()=>toast('คัดลอกไม่สำเร็จ ลองเลือกข้อความเองแล้วกด Ctrl+C'))}
else toast('เบราว์เซอร์นี้คัดลอกอัตโนมัติไม่ได้ ลองเลือกข้อความเองแล้วกด Ctrl+C');break}
case'setstar':V.starTmp[t.dataset.name]=+t.dataset.n;refresh();break;
case'submitrate':{const pid=t.dataset.pid,to=t.dataset.to,key=t.dataset.key,stars=V.starTmp[key]||0;
if(!stars){toast('กรุณาเลือกจำนวนดาวก่อน');break}
const comment=prompt('คอมเมนต์สั้น ๆ (ไม่บังคับ)')||'';
S.reviews.push({project:pid,to,from:S.me.name,stars,comment,ts:Date.now()});
delete V.starTmp[key];notify(to,`คุณได้รับรีวิว ${stars}/5 ดาวจาก ${S.me.name}`);toast('ส่งคะแนนแล้ว');refresh();break}}});
document.addEventListener('change',e=>{
if(e.target.id==='ss'){const p=cur();p.status=e.target.value;p.members.filter(m=>!m.me).forEach(m=>notify(mName(m),`"${p.title}" เปลี่ยนสถานะเป็น ${STT[p.status]}`));refresh()}
if(e.target.id==='avfile'){const f=e.target.files[0];if(f)readResized(f,300,url=>{S.me.avatar=url;save();render()})}
if(e.target.id==='galfile'){const f=e.target.files[0];if(f){const cap=prompt('คำอธิบายผลงาน (ไม่บังคับ)')||'';readResized(f,600,url=>{S.me.portfolio.push({id:'g'+Date.now(),img:url,caption:cap});save();render()})}}
});
['q','fkind','fstat','ffmt','ffsk'].forEach(x=>$('#'+x).addEventListener('input',render));
render();
})();
</script></body></html>
